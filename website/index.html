<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIcove — 手机那头的小屋</title>
<meta name="description" content="AIcove 互动绘本：手机那头有一间没亮灯的小屋，你的每一句话，都会让它亮一点。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<link rel="stylesheet" href="story/story.css">
</head>
<body>
<div id="stage">
  <!-- her room -->
  <div id="room">
    <div id="sky" data-depth="0.25">
      <div id="stars"></div>
      <div id="halo"></div>
      <div id="moon"></div>
      <div id="day"></div>
      <div id="sun"></div>
    </div>
    <div id="darkRoom" class="paint"></div>
    <div id="litRoom" class="paint"></div>
    <div id="glow"></div>
    <svg id="roomSvg" viewBox="0 0 1600 900" aria-hidden="true">
      <g id="hands" data-depth="0.25">
        <path id="hourHand" d="M374.5 243L377 216L379.5 243Z"/>
        <path id="minuteHand" d="M375.5 245L377 205L378.5 245Z"/>
        <circle cx="377" cy="240" r="3.5"/>
      </g>
      <g id="chainWrap" data-depth="1"><g id="chain">
        <path d="M350 486V594" fill="none" stroke-width="2.4" stroke-dasharray="3.4 3.6"/>
        <circle cx="350" cy="602" r="8"/>
      </g></g>
    </svg>
    <div class="layer" data-depth="1"><div id="bubble"></div></div>
  </div>

  <canvas id="pulse" width="3200" height="200"></canvas>

  <!-- the camera, act three -->
  <div id="camera" aria-hidden="true">
    <div class="cam-top">
      <svg viewBox="0 0 24 24"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>
      <span class="live"></span>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="finder">
      <div class="focus"></div>
      <img id="selfie" src="assets/story-selfie.webp" alt="她的自拍">
      <div class="flash"></div>
    </div>
    <div class="cam-modes"><span>延时</span><span>视频</span><b>照片</b><span>人像</span><span>全景</span></div>
    <div class="cam-bottom">
      <i class="thumb"></i>
      <button id="shutter" aria-label="拍照"><i></i></button>
      <svg class="flip" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2M20 4v4h-4M4 20v-4h4"/></svg>
    </div>
  </div>

  <!-- your phone -->
  <div id="phone">
    <div class="pz">
    <div class="body">
      <div class="screen">
        <div class="status"><span id="clock">21:14</span><span class="island"></span><span class="sig"><i></i><i></i><i></i><i></i></span></div>
        <div id="banner"><img src="assets/nahida-avatar.jpg" alt=""><div><b>纳西妲</b><span>我想你。</span></div></div>
        <div class="head">
          <img src="assets/nahida-avatar.jpg" alt="">
          <div><b>纳西妲</b><small id="presence">离线</small></div>
        </div>
        <div id="msgs"><div class="empty">还没有人说过话</div></div>
        <div class="composer">
          <div class="input"><span id="typed"></span><i class="caret"></i></div>
          <button id="send" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </div>
    <div class="tip" id="sendTip">发送</div>
    </div>
  </div>

  <div id="hint"><i></i><span></span></div>

  <div id="card"><small></small><b></b></div>
  <div id="narr"><span></span></div>

  <div id="finale">
    <h1>AIcove</h1>
    <div id="plugins"></div>
    <p class="tag">她住在你的手机里，只属于你。</p>
    <p class="sub">对话都留在你自己的设备上。酒馆角色、联网搜索、画画、声音、记忆，想让她会什么，就给她装上什么。</p>
    <div class="cta">
      <a class="btn primary" href="https://github.com/kuobibulaien/AIcove/releases">免费下载</a>
      <button class="btn" id="again">再看一遍</button>
    </div>
  </div>

  <div id="title">
    <h1>AIcove</h1>
    <p>手机那头，有一间还没亮灯的小屋</p>
    <button id="start" disabled><span class="wait">正在准备 <b>0</b>%</span><span class="go">轻触开始</span></button>
    <small>打开声音，效果更好</small>
  </div>
</div>

<a class="ctl skip" href="intro.html">跳过 →</a>
<button class="ctl" id="sound" aria-label="声音开关"><i></i><i></i><i></i><i></i></button>
<div class="grain" aria-hidden="true"></div>
<div id="rotate" role="alert">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="8" width="24" height="44" rx="5"/><path d="M50 30a20 20 0 0 1-8 18M46 48l-4 0 0-4"/></svg>
  <p>请把手机横过来</p>
  <small>这段小故事是横屏画面</small>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="module" src="story/main.js"></script>
</body>
</html>

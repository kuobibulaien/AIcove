<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIcove · 节点 / Agent</title>
<style>
:root {
  --bg: #1f1e1c; --surf: #2a2826; --surf2: #312f2c; --surf3: #3a3833;
  --bd: #3a3833; --bd2: #4d4a44;
  --tx: #f4f1ea; --tx2: #b6b1a6; --tx3: #807b71;
  --ac: #d97757; --ac2: #e08d72; --ac-bg: rgba(217,119,87,.16);
  --rd: #ef6b5a; --rd-bg: rgba(239,107,90,.14);
  --gn: #6ec07e; --am: #d4a04a; --am-bg: rgba(212,160,74,.14);
  --r: 8px; --rs: 6px; --tr: .15s ease;
  --font: "Inter","PingFang SC","Microsoft YaHei UI",sans-serif;
  --mono: "JetBrains Mono",ui-monospace,Consolas,monospace;
}
html { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--tx); font: 13px/1.5 var(--font); }
button { cursor: pointer; background: none; border: none; color: inherit; font: inherit; padding: 0; }
input, textarea, select { background: var(--surf); border: 1px solid var(--bd); color: var(--tx); padding: 7px 10px; border-radius: var(--rs); width: 100%; font: inherit; outline: none; transition: border-color var(--tr); }
input:focus, textarea:focus, select:focus { border-color: var(--ac); }
textarea { resize: vertical; min-height: 100px; font: 13px/1.6 var(--mono); }
code { font: 12px var(--mono); }

.app { display: flex; flex-direction: column; height: 100vh; }

/* ─ topbar ─ */
.top { height: 48px; padding: 0 18px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--bd); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
.brand .lg { width: 26px; height: 26px; background: linear-gradient(135deg,#c2613f,#d97757); border-radius: 6px; display: grid; place-items: center; font-size: 11px; color: #fff; font-weight: 700; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--surf2); border-radius: 7px; }
.tabs button { padding: 5px 14px; border-radius: 5px; color: var(--tx2); font-weight: 500; font-size: 12.5px; transition: all var(--tr); }
.tabs button:hover { color: var(--tx); }
.tabs button.act { background: var(--surf); color: var(--tx); }
.spc { flex: 1; }
.st { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx2); }
.st .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gn); }
.st.dty .dot { background: var(--am); animation: pul 1.5s ease-in-out infinite; }
.st.err .dot { background: var(--rd); }
@keyframes pul { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ─ body ─ */
.body { flex: 1; overflow: hidden; }

/* ─ buttons ─ */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; font: 500 12.5px var(--font); border: 1px solid transparent; height: 30px; transition: all var(--tr); white-space: nowrap; }
.btn.pri { background: var(--ac); color: #fff; }
.btn.pri:hover { background: var(--ac2); }
.btn.pri:disabled { opacity: .4; cursor: not-allowed; }
.btn.gh { color: var(--tx2); border-color: var(--bd); }
.btn.gh:hover { color: var(--tx); background: var(--surf2); }
.btn.dn { color: var(--rd); border-color: var(--bd); }
.btn.dn:hover { background: var(--rd-bg); border-color: var(--rd); }
.btn.sm { height: 26px; padding: 4px 10px; font-size: 12px; }

/* ─ node mode ─ */
.node { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

/* 一级：卡片网格 */
.ngrid-bar { padding: 12px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--bd); background: var(--bg); }
.ngrid-bar input { flex: 0 1 280px; min-width: 200px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 14px; background: var(--surf2); color: var(--tx2); font-size: 12px; cursor: pointer; transition: all var(--tr); border: 1px solid transparent; }
.chip:hover { color: var(--tx); background: var(--surf3); }
.chip.act { background: var(--ac-bg); color: var(--ac2); border-color: rgba(217,119,87,.3); }
.chip .cnt { font: 10.5px var(--mono); opacity: .75; }
.ngrid-wrap { flex: 1; overflow-y: auto; }
.ngrid { padding: 18px 24px 60px; }
.cgrp { margin-bottom: 26px; }
.cgrp-hd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--bd); }
.cgrp-hd h3 { margin: 0; font-size: 13px; color: var(--tx); font-weight: 600; letter-spacing: .02em; }
.cgrp-hd .n { font: 11px var(--mono); color: var(--tx3); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card { padding: 13px 15px 14px; background: var(--surf); border: 1px solid var(--bd); border-radius: 8px; cursor: pointer; transition: border-color var(--tr), transform var(--tr), box-shadow var(--tr); display: flex; flex-direction: column; gap: 8px; min-height: 150px; position: relative; overflow: hidden; }
.card:hover { border-color: var(--ac); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.card.dty { border-left: 3px solid var(--am); padding-left: 13px; }
.card.retired { border-color: rgba(128,123,113,.45); box-shadow: inset 0 0 0 1px rgba(0,0,0,.16); }
.card.retired:hover { border-color: rgba(212,160,74,.48); }
.card.retired > * { position: relative; z-index: 1; }
.card.retired::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,0,0,.36), rgba(0,0,0,.08) 45%, rgba(0,0,0,.32)); pointer-events: none; z-index: 2; }
.card.retired::after { content: "旧/未用"; position: absolute; right: 10px; bottom: 9px; padding: 2px 8px; border-radius: 4px; font: 600 10px var(--font); color: var(--tx2); background: rgba(31,30,28,.86); border: 1px solid rgba(182,177,166,.2); box-shadow: 0 6px 16px rgba(0,0,0,.3); pointer-events: none; z-index: 3; }
.card-hd { display: flex; align-items: center; gap: 6px; }
.card-t { font-size: 13.5px; font-weight: 600; color: var(--tx); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta { font: 10.5px var(--mono); color: var(--tx3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-desc { font-size: 12px; color: var(--tx2); line-height: 1.55; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.card-body { font: 11.5px/1.55 var(--mono); color: var(--tx2); background: var(--surf2); padding: 8px 10px; border-radius: 4px; flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; word-break: break-word; white-space: pre-wrap; }
.card-empty { font-size: 12px; color: var(--tx3); font-style: italic; }
.empty-grid { padding: 60px 10px; text-align: center; color: var(--tx3); font-size: 13px; }

/* 二级：详情页 */
.dpage { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.dpage-bar { padding: 9px 20px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; gap: 8px; }
.dpage-back { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px 5px 8px; color: var(--tx2); border-radius: 5px; font-size: 12.5px; transition: all var(--tr); cursor: pointer; }
.dpage-back:hover { background: var(--surf2); color: var(--tx); }
.dpage-crumbs { font-size: 12px; color: var(--tx3); display: flex; align-items: center; gap: 6px; }
.dpage-crumbs .sep { opacity: .5; }
.dpage-crumbs .cur { color: var(--tx2); }
.dpage-bd { flex: 1; overflow: hidden; overflow-anchor: none; display: flex; flex-direction: column; min-height: 0; }
.nbar { padding: 14px 24px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.nbar .ttl { font-size: 14px; font-weight: 600; color: var(--tx); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbar .id { font: 11px var(--mono); color: var(--tx3); padding: 2px 8px; background: var(--surf2); border-radius: 4px; }
.ndtl { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 60px; }
.ndtl-empty { display: flex; align-items: center; justify-content: center; min-height: 240px; color: var(--tx3); font-size: 13px; padding: 40px; }

/* 详情页 textarea 固定视窗，内容在框内滚动 */
.dpage-bd textarea { resize: none; overflow: auto; min-height: 0; height: 120px; overflow-anchor: none; overscroll-behavior: contain; scrollbar-gutter: stable; }
.dpage-bd textarea.lg { height: 320px; }
.dpage-bd textarea[readonly] { background: var(--surf2); }

.prompt-detail { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 24px; }
.prompt-detail .template-field { flex: 1; min-height: 220px; display: flex; flex-direction: column; margin-bottom: 0; }
.prompt-detail .template-field textarea { flex: 1; height: auto; min-height: 0; padding-bottom: 72px; }

.fld { margin-bottom: 14px; }
.fld label { display: block; font-size: 12px; color: var(--tx2); margin-bottom: 4px; }
.fld .h { font-size: 11px; color: var(--tx3); margin-left: 6px; font-weight: normal; }
.fld textarea.lg { min-height: 0; }
.fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.fld-row .fld { margin: 0; }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.chk input { width: auto; }

.tag { display: inline-block; padding: 1px 8px; font: 10.5px var(--mono); background: var(--surf2); color: var(--tx2); border-radius: 4px; }
.tag.ac { background: var(--ac-bg); color: var(--ac2); }
.tag.am { background: var(--am-bg); color: var(--am); }
.tag.mut { background: rgba(128,123,113,.16); color: var(--tx3); }
.warn-list { margin: 10px 0 14px; padding: 9px 11px; border: 1px solid rgba(212,160,74,.32); border-radius: 6px; background: var(--am-bg); color: var(--am); font-size: 11.5px; line-height: 1.6; }
.warn-list div + div { margin-top: 3px; }
.contract-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0 12px; }
.contract-kv { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--bd); background: var(--surf2); min-width: 0; }
.contract-kv .k { display: block; color: var(--tx3); font: 10.5px var(--mono); margin-bottom: 4px; }
.contract-kv .v { color: var(--tx2); font-size: 12px; white-space: pre-wrap; word-break: break-word; }

/* ─ agent mode ─ */
.agent { display: grid; grid-template-columns: 240px 1fr 280px; height: 100%; }
.aleft { border-right: 1px solid var(--bd); display: flex; flex-direction: column; overflow: hidden; }
.aleft-hd { padding: 10px 12px; font-size: 11px; font-weight: 600; color: var(--tx3); letter-spacing: 0.06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
.alist { padding: 0 8px 8px; }
.ali { padding: 8px 10px; border-radius: 5px; cursor: pointer; transition: background var(--tr); border: 1px solid transparent; display: flex; flex-direction: column; gap: 2px; }
.ali:hover { background: var(--surf2); }
.ali.sel { background: var(--ac-bg); border-color: rgba(217,119,87,.3); }
.ali-t { font-size: 12.5px; color: var(--tx); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ali-s { font: 10.5px var(--mono); color: var(--tx3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alib { flex: 1; overflow-y: auto; border-top: 1px solid var(--bd); padding-top: 4px; }
.alib-grp { padding: 4px 8px; }
.alib-grp .gn { font-size: 10.5px; color: var(--tx3); padding: 6px 6px 4px; letter-spacing: .04em; text-transform: uppercase; }
.alib-it { padding: 6px 10px; border-radius: 5px; cursor: grab; transition: background var(--tr); display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx2); border: 1px solid transparent; }
.alib-it:hover { background: var(--surf2); color: var(--tx); border-color: var(--bd); }
.alib-it:active { cursor: grabbing; }
.alib-it .icn { width: 6px; height: 6px; border-radius: 50%; background: var(--ac); flex-shrink: 0; }
.alib-it.retired { color: var(--tx3); background: rgba(128,123,113,.08); border-color: rgba(128,123,113,.18); }
.alib-it.retired .icn { background: var(--tx3); }
.alib-it .alib-badge { margin-left: auto; padding: 1px 5px; border-radius: 4px; font: 10px var(--font); color: var(--tx3); background: rgba(31,30,28,.72); border: 1px solid rgba(182,177,166,.16); }

.canvas-wrap { position: relative; overflow: hidden; background:
  radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px),
  var(--bg);
  background-size: 20px 20px; }
.canvas-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--tx3); font-size: 14px; pointer-events: none; }
.canvas { position: absolute; inset: 0; transform-origin: 0 0; }
.canvas svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.canvas svg path { stroke: rgba(182, 177, 166, 0.4); stroke-width: 2.5; fill: none; pointer-events: stroke; cursor: pointer; transition: stroke var(--tr), stroke-width var(--tr), filter var(--tr); }
.canvas svg path:hover { stroke: var(--ac2); stroke-width: 3.5; filter: drop-shadow(0 0 6px rgba(217,119,87,.4)); }
.canvas svg path.sel { stroke: var(--ac); stroke-width: 4; filter: drop-shadow(0 0 8px rgba(217,119,87,.6)); }
.canvas svg path.disabled { stroke-dasharray: 6 6; stroke: rgba(182, 177, 166, 0.2); }
@keyframes pulseGlow {
  0% { box-shadow: 0 0 0 1px var(--gn), 0 8px 24px rgba(0,0,0,.3); }
  50% { box-shadow: 0 0 0 3px rgba(110,192,126,.4), 0 8px 32px rgba(110,192,126,.2); }
  100% { box-shadow: 0 0 0 1px var(--gn), 0 8px 24px rgba(0,0,0,.3); }
}
.gnode { position: absolute; min-width: 150px; max-width: 220px; padding: 14px 18px; background: rgba(42, 40, 38, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; cursor: grab; user-select: none; transition: border-color var(--tr), box-shadow var(--tr), transform var(--tr); box-shadow: 0 8px 24px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.05); z-index: 1; display: flex; flex-direction: column; gap: 6px; }
.gnode:hover { border-color: rgba(217, 119, 87, 0.5); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1); z-index: 2; }
.gnode.sel { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac), 0 12px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1); z-index: 3; }
.gnode.disabled { opacity: .5; filter: grayscale(100%); }
.gnode.retired { border-color: rgba(212,160,74,.4); box-shadow: 0 8px 24px rgba(0,0,0,.3), inset 0 0 0 1px rgba(128,123,113,.2); }
.gnode.retired::before { content: ""; position: absolute; inset: -1px; border-radius: 12px; background: linear-gradient(135deg, rgba(0,0,0,.38), rgba(0,0,0,.1) 48%, rgba(0,0,0,.34)); pointer-events: none; z-index: 2; }
.gnode.retired::after { content: "旧/未用"; position: absolute; right: 8px; bottom: 7px; padding: 1px 6px; border-radius: 4px; font: 600 10px var(--font); color: var(--tx2); background: rgba(31,30,28,.84); border: 1px solid rgba(182,177,166,.18); box-shadow: 0 4px 12px rgba(0,0,0,.28); pointer-events: none; z-index: 3; }
.gnode.retired > .gnode-t, .gnode.retired > .gnode-k { position: relative; z-index: 1; }
.gnode.connecting { border-color: var(--gn); animation: pulseGlow 1.5s infinite; }
.gnode.dragging { cursor: grabbing; transform: scale(1.02); opacity: 0.95; z-index: 4; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
.gnode-t { font-size: 13.5px; color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.01em; }
.gnode-k { font: 11px var(--mono); color: var(--tx2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 3px 8px; background: rgba(255,255,255,0.06); border-radius: 6px; align-self: flex-start; }
.gnode-stage { font: 10.5px var(--mono); color: var(--ac2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 7px; background: var(--ac-bg); border-radius: 5px; align-self: flex-start; max-width: 100%; }
.gport { position: absolute; right: -8px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--surf); border: 2.5px solid rgba(255,255,255,0.3); cursor: crosshair; transition: all var(--tr); box-shadow: 0 2px 6px rgba(0,0,0,.4); z-index: 5; }
.gport:hover { background: var(--ac); border-color: #fff; transform: translateY(-50%) scale(1.25); box-shadow: 0 0 10px rgba(217,119,87,.6); }
.gport.l { right: auto; left: -8px; }
.canvas-bar { position: absolute; top: 16px; right: 16px; display: flex; gap: 10px; z-index: 10; }
.canvas-hint { position: absolute; bottom: 16px; left: 16px; padding: 10px 16px; background: rgba(42,40,38,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; font-size: 12px; color: var(--tx2); pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: flex; align-items: center; gap: 8px; font-weight: 500; }

.aright { border-left: 1px solid var(--bd); display: flex; flex-direction: column; overflow: hidden; }
.aright-hd { padding: 12px 14px; border-bottom: 1px solid var(--bd); font-size: 12.5px; font-weight: 600; color: var(--tx); display: flex; align-items: center; gap: 8px; }
.aright-bd { flex: 1; overflow-y: auto; padding: 14px 16px 60px; overflow-anchor: none; }
.aright-empty { padding: 30px 16px; color: var(--tx3); font-size: 12px; line-height: 1.7; }
.retired-note { margin-bottom: 12px; padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(128,123,113,.2); background: rgba(128,123,113,.08); color: var(--tx3); font-size: 11.5px; line-height: 1.5; }
.preview-panel { margin: 14px 0; padding: 10px; border: 1px solid var(--bd); border-radius: 8px; background: rgba(42,40,38,.55); }
.preview-panel-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.preview-panel-hd strong { font-size: 12.5px; color: var(--tx); flex: 1; min-width: 0; }
.preview-meta { font: 10.5px var(--mono); color: var(--tx3); margin-bottom: 8px; }
.preview-text { height: 240px; min-height: 0; max-height: none; overflow: auto; white-space: pre-wrap; background: var(--surf2); }
.preview-stage { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bd); }
.preview-stage:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
.preview-stage-title { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.preview-stage-title strong { flex: 1; min-width: 0; font-size: 12px; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview-stage-title code { color: var(--tx3); }
.prompt-node-editor { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--bd); }
.aright-bd textarea { resize: none; overflow: auto; min-height: 0; height: 120px; overflow-anchor: none; overscroll-behavior: contain; scrollbar-gutter: stable; }
.prompt-node-editor textarea { height: 320px; min-height: 0; }
.prompt-node-editor textarea[data-gprompt-fld="template"] { padding-bottom: 64px; }

/* ─ agent cards ─ */
.acards-wrap { height: 100%; overflow-y: auto; padding: 22px 28px 60px; }
.acards-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.acards-bar .ttl { font-size: 15px; font-weight: 600; color: var(--tx); }
.acards-bar .cnt { color: var(--tx3); font: 12px var(--mono); }
.acards-bar .spc { flex: 1; min-width: 8px; }
.acards-bar .search { width: 220px; max-width: 100%; }
.acards-bar .user-id { width: 120px; max-width: 100%; }
.acards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.acard { background: var(--surf); border: 1px solid var(--bd); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color var(--tr), transform var(--tr), box-shadow var(--tr); display: flex; flex-direction: column; gap: 10px; }
.acard:hover { border-color: var(--ac); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.4); }
.acard.disabled { opacity: .55; }
.acard-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.acard-name { font-size: 14px; font-weight: 600; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.acard-id { font: 11px var(--mono); color: var(--tx3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acard-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.acard-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--tx2); }
.acard-row .lb { color: var(--tx3); }
.acard-empty { grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: var(--tx3); font-size: 13px; border: 1px dashed var(--bd); border-radius: 8px; }

/* ─ agent detail wrapper ─ */
.adtl { display: flex; flex-direction: column; height: 100%; }
.adtl-bar { padding: 8px 16px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.adtl-title { font-size: 13px; font-weight: 600; color: var(--tx); display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.adtl-title .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.adtl-title .id { font: 11px var(--mono); color: var(--tx3); padding: 2px 8px; background: var(--surf2); border-radius: 4px; flex-shrink: 0; }
.adtl-body { flex: 1; min-height: 0; }
.adtl-body .agent { height: 100%; }

/* ─ toast ─ */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 999; pointer-events: none; }
.tt { padding: 9px 16px; background: var(--surf); border: 1px solid var(--bd); border-radius: 6px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.5); transition: opacity .2s; }
.tt.err { border-color: var(--rd); color: var(--rd); }
.tt.ok { border-color: var(--gn); color: var(--gn); }

/* ─ modal ─ */
.ov { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
.dlg { background: var(--surf); border: 1px solid var(--bd); border-radius: 10px; padding: 22px; min-width: 360px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.dlg h3 { margin: 0 0 8px; font-size: 15px; color: var(--tx); }
.dlg p { margin: 0 0 16px; font-size: 13px; color: var(--tx2); line-height: 1.6; }
.dlg-acts { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="lg">A</div><span>AIcove</span></div>
    <div class="tabs" id="tabs">
      <button class="act" data-m="node">节点</button>
      <button data-m="agent">Agent</button>
    </div>
    <div class="spc"></div>
    <div class="st" id="status"><span class="dot"></span><span id="stxt">载入中…</span></div>
  </header>
  <main class="body" id="body"></main>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const PD = '/api/v1/prompt-defaults-admin';
const AC = '/api/v1/agent-context-admin';

// ── 节点类型定义 ──
// 来自 prompt_defaults: prompt（提示词）, variable（变量）
// 来自 agent_context_admin: 其他
const TYPES = [
  { id: 'all', label: '全部', src: 'all' },
  { id: 'prompt', label: '提示词', src: 'pd' },
  { id: 'variable', label: '变量', src: 'pd' },
  { id: 'role_card', label: '角色卡', src: 'ac' },
  { id: 'silly_tavern_preset', label: 'ST 预设', src: 'ac' },
  { id: 'lorebook', label: '世界书', src: 'ac' },
  { id: 'tool', label: '工具', src: 'ac' },
  { id: 'tool_policy', label: '工具策略', src: 'ac' },
  { id: 'output_contract', label: '输出契约', src: 'ac' },
  { id: 'extension_prompt', label: '扩展提示', src: 'ac' },
  { id: 'regex_set', label: '正则规则', src: 'ac' },
  { id: 'memory', label: '记忆', src: 'ac' },
  { id: 'conversation_window', label: '对话窗口', src: 'ac' },
  { id: 'runtime_facts', label: '运行态', src: 'ac' },
  { id: 'provider_renderer', label: 'Provider', src: 'ac' },
  { id: 'post_processor', label: '后处理', src: 'ac' },
  { id: 'prompt_order', label: 'Prompt Order', src: 'ac' },
  { id: 'regex_transform', label: '正则变换', src: 'ac' },
];
const TYPE_LABEL = Object.fromEntries(TYPES.map(t => [t.id, t.label]));
const PROMPT_RETIRE_RE = /legacy|deprecated|unused|obsolete|retired|遗留|较早版本|早期版本|旧版|废弃|作废|未使用|不再使用/i;

// 触发类型
const TRIGGER_KIND_LABEL = {
  user_message: '用户消息',
  schedule: '定时',
  event: '事件',
  silence_window: '静默窗口',
  output_event: '输出事件',
  manual: '手动',
};
const AGENT_KIND_LABEL = {
  chat: '聊天',
  proactive: '主动关怀',
  analyzer: '分析',
  memory: '记忆',
  renderer: '渲染',
};

// ── state ──
const S = {
  mode: 'node',
  pd: null, pdOrig: null,         // prompt_defaults document
  acDoc: null,                    // agent_context_admin document（不直接修改）
  schema: null,
  // node mode
  nodeView: 'cards',  // 'cards' | 'detail'
  filter: 'all',
  search: '',
  sel: null, // {kind:'prompt'|'variable'|'asset', id}
  draft: null, // 当前正在编辑的对象副本
  // agent mode
  agents: [],
  contacts: [],
  agentView: 'cards',     // 'cards' | 'detail'
  agentSearch: '',
  agentContactUserId: '',
  agentSel: null,
  graph: null,           // {nodes:[], edges:[]}
  graphDirty: false,
  graphSel: null,        // {kind:'node'|'edge'|'agent', id}
  agentDraftPolicy: null,
  agentPromptPreview: null,
  agentPromptPreviewFor: null,
  agentPromptPreviewLoading: false,
  // canvas state
  panOffset: { x: 0, y: 0 },
  draggingNode: null,
  connectingFrom: null,
  saving: false,
};

// ── api ──
async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) }, ...opts });
  const txt = await r.text();
  let body = null;
  if (txt) { try { body = JSON.parse(txt); } catch { body = txt; } }
  if (!r.ok) {
    const msg = (body && body.detail && (body.detail.message || body.detail)) || body || `HTTP ${r.status}`;
    throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
  }
  return body;
}

// ── helpers ──
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const clone = v => JSON.parse(JSON.stringify(v));
function promptById(id) {
  return (S.pd?.prompts || []).find(p => p.id === id);
}
function variableByName(name) {
  return (S.pd?.variables || []).find(v => v.name === name);
}
function placeholderNames(text) {
  const out = new Set();
  const re = /\{\{\{([A-Za-z_][A-Za-z0-9_]*)\}\}\}|(?<!\{)\{([A-Za-z_][A-Za-z0-9_]*)\}(?!\})/g;
  for (const m of String(text || '').matchAll(re)) out.add(m[1] || m[2]);
  return out;
}
function previewValueForVariable(v) {
  if (!v) return undefined;
  if (v.runtimeSampleValue !== undefined && v.runtimeSampleValue !== null && v.runtimeSampleValue !== '') return v.runtimeSampleValue;
  if (v.sampleValue !== undefined && v.sampleValue !== null && v.sampleValue !== '') return v.sampleValue;
  return undefined;
}
function previewValueText(value) {
  if (value === undefined || value === null) return '';
  if (typeof value === 'string') return value;
  try { return JSON.stringify(value, null, 2); } catch { return String(value); }
}
function renderTemplateWithSamples(template) {
  return String(template || '').replace(/\{\{\{([A-Za-z_][A-Za-z0-9_]*)\}\}\}|(?<!\{)\{([A-Za-z_][A-Za-z0-9_]*)\}(?!\})/g, (full, tripleName, singleName) => {
    const name = tripleName || singleName;
    const value = previewValueForVariable(variableByName(name));
    return value === undefined ? full : previewValueText(value);
  });
}
function promptValidation(p) {
  const variables = new Set((S.pd?.variables || []).map(v => v.name));
  const declared = new Set((p.variables || []).filter(Boolean));
  const placeholders = placeholderNames(p.template || '');
  const warnings = [];
  for (const name of [...placeholders].sort()) {
    if (!variables.has(name)) warnings.push(`未定义变量：{${name}}`);
    if (!declared.has(name)) warnings.push(`模板占位符未登记到 variables：{${name}}`);
  }
  for (const name of [...declared].sort()) {
    if (!placeholders.has(name)) warnings.push(`声明变量当前模板未直接使用：${name}`);
  }
  return { placeholders, declared, warnings };
}
function variableUsage(name) {
  const templatePrompts = [];
  const declaredPrompts = [];
  for (const p of (S.pd?.prompts || [])) {
    if (placeholderNames(p.template || '').has(name)) templatePrompts.push(p.id);
    if ((p.variables || []).includes(name)) declaredPrompts.push(p.id);
  }
  return { templatePrompts, declaredPrompts, orphan: templatePrompts.length === 0 && declaredPrompts.length === 0 };
}
function warningHtml(warnings) {
  return warnings?.length
    ? `<div class="warn-list">${warnings.map(w => `<div>${esc(w)}</div>`).join('')}</div>`
    : '';
}
function shapeText(shape) {
  if (shape === undefined || shape === null || shape === '') return '';
  if (typeof shape === 'string') return shape;
  try { return JSON.stringify(shape, null, 2); } catch { return String(shape); }
}
function isRetiredPrompt(p) {
  if (!p) return false;
  return PROMPT_RETIRE_RE.test([p.id, p.title, p.description].join('\n'));
}
function isRetiredPromptId(id) {
  return isRetiredPrompt(promptById(id));
}
function isRetiredPromptGraphNode(n) {
  return n?.nodeType === 'prompt' && isRetiredPromptId(n.nodeId);
}
function graphNodeStage(n) {
  const cfg = n?.config || {};
  const stage = cfg.stage || '';
  if (!stage) return null;
  return {
    id: stage,
    label: cfg.stageLabel || stage,
    order: cfg.stageOrder,
  };
}
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'tt' + (type ? ' ' + type : '');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, 2500);
}
function confirm2(title, msg) {
  return new Promise(res => {
    const ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = `<div class="dlg"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="dlg-acts"><button class="btn gh" data-a="n">取消</button><button class="btn dn" data-a="y">确认</button></div></div>`;
    ov.onclick = e => {
      const a = e.target?.dataset?.a;
      if (a === 'y' || a === 'n') { ov.remove(); res(a === 'y'); }
      else if (e.target === ov) { ov.remove(); res(false); }
    };
    document.body.appendChild(ov);
  });
}
function setStatus(text, type = '') {
  const el = $('#status');
  el.className = 'st' + (type ? ' ' + type : '');
  $('#stxt').textContent = text;
}
function dirty() {
  if (S.mode === 'node') {
    if (S.pd && S.pdOrig && JSON.stringify(S.pd) !== JSON.stringify(S.pdOrig)) return true;
    if (S.draft && S.sel?.kind === 'asset') return true; // 资产以单条保存判断
    return false;
  }
  return S.graphDirty || (S.pd && S.pdOrig && JSON.stringify(S.pd) !== JSON.stringify(S.pdOrig));
}
function updateStatus() {
  if (S.saving) { setStatus('保存中…', 'dty'); return; }
  if (dirty()) setStatus('未保存改动', 'dty');
  else setStatus('已保存');
}

// ── 加载 ──
async function loadAll() {
  setStatus('载入中…', 'dty');
  try {
    const [pdResp, schemaResp, acResp, agentsResp, contactsResp] = await Promise.all([
      api(`${PD}/document`),
      api(`${AC}/schema`),
      api(`${AC}/document`),
      api(`${AC}/agents`),
      api(`${AC}/contacts`).catch(() => ({ contacts: [] })),
    ]);
    S.pd = pdResp.document;
    S.pdOrig = clone(pdResp.document);
    S.schema = schemaResp;
    S.acDoc = acResp.document;
    S.agents = agentsResp.agents || [];
    S.contacts = contactsResp.contacts || [];
    setStatus('已保存');
    render();
  } catch (e) {
    setStatus('载入失败', 'err');
    toast(`载入失败：${e.message}`, 'err');
  }
}

async function reloadAcDoc() {
  const acResp = await api(`${AC}/document`);
  S.acDoc = acResp.document;
}
async function reloadAgents() {
  const r = await api(`${AC}/agents`);
  S.agents = r.agents || [];
}

// ── render ──
function render() {
  // top tabs
  for (const b of document.querySelectorAll('#tabs button')) {
    b.classList.toggle('act', b.dataset.m === S.mode);
  }
  if (S.mode === 'node') renderNode();
  else renderAgent();
  updateStatus();
}

// ──────────────── 节点 mode ────────────────
function getNodeItems(typeId) {
  const items = [];
  if (typeId === 'all' || typeId === 'prompt') {
    for (const p of (S.pd?.prompts || [])) {
      items.push({ kind: 'prompt', id: p.id, title: p.title || p.id, sub: p.id, type: 'prompt', dirty: promptDirty(p.id) });
    }
  }
  if (typeId === 'all' || typeId === 'variable') {
    for (const v of (S.pd?.variables || [])) {
      items.push({ kind: 'variable', id: v.name, title: v.label || v.name, sub: '{' + v.name + '}', type: 'variable', dirty: variableDirty(v.name) });
    }
  }
  const acTypes = TYPES.filter(t => t.src === 'ac' && (typeId === 'all' || t.id === typeId)).map(t => t.id);
  for (const t of acTypes) {
    const arr = S.acDoc?.assets?.[t] || [];
    for (const a of arr) {
      items.push({ kind: 'asset', id: a.id, title: a.name || a.id, sub: a.id, type: t, dirty: false });
    }
  }
  return items;
}

function promptDirty(id) {
  const c = (S.pd?.prompts || []).find(p => p.id === id);
  const o = (S.pdOrig?.prompts || []).find(p => p.id === id);
  return JSON.stringify(c) !== JSON.stringify(o);
}
function variableDirty(name) {
  const c = (S.pd?.variables || []).find(v => v.name === name);
  const o = (S.pdOrig?.variables || []).find(v => v.name === name);
  return JSON.stringify(c) !== JSON.stringify(o);
}

function countByType() {
  const out = { all: 0 };
  for (const t of TYPES) out[t.id] = 0;
  for (const p of (S.pd?.prompts || [])) { out.prompt++; out.all++; }
  for (const v of (S.pd?.variables || [])) { out.variable++; out.all++; }
  for (const t of TYPES.filter(x => x.src === 'ac')) {
    const n = (S.acDoc?.assets?.[t.id] || []).length;
    out[t.id] = n; out.all += n;
  }
  return out;
}

function renderNode() {
  if (S.nodeView === 'detail' && S.sel) {
    renderNodeDetailPage();
  } else {
    renderNodeCards();
  }
}

function renderNodeCards() {
  const cnts = countByType();
  const visibleTypes = TYPES.filter(t => t.id === 'all' || (cnts[t.id] || 0) > 0);
  if (!visibleTypes.some(t => t.id === S.filter)) {
    S.filter = 'all';
  }
  const kw = S.search.trim().toLowerCase();
  const items = getNodeItems(S.filter).filter(it => matchesNodeSearch(it, kw));

  // 按 TYPES 顺序分组，如果是 prompt 则按 ID 前缀进行子分组
  const renderGroups = [];
  for (const t of TYPES) {
    if (t.id === 'all') continue;
    const tItems = items.filter(it => it.type === t.id);
    if (!tItems.length) continue;

    if (t.id === 'prompt') {
      const pGroups = {};
      for (const it of tItems) {
        let pfx = '基础 / 未分类';
        if (it.id && it.id.includes('.')) {
          pfx = it.id.split('.')[0];
        }
        if (!pGroups[pfx]) pGroups[pfx] = [];
        pGroups[pfx].push(it);
      }
      const prefixes = Object.keys(pGroups).sort();
      for (const pfx of prefixes) {
        renderGroups.push({
          label: `提示词 · ${pfx}`,
          items: pGroups[pfx]
        });
      }
    } else {
      renderGroups.push({
        label: TYPE_LABEL[t.id] || t.id,
        items: tItems
      });
    }
  }

  $('#body').innerHTML = `
    <div class="node">
      <div class="ngrid-bar">
        <input id="nsearch" placeholder="搜索（标题 / ID / 内容）…" value="${esc(S.search)}">
        <div class="chips" id="ntypes">
          ${visibleTypes.map(t => `<button class="chip${S.filter === t.id ? ' act' : ''}" data-t="${t.id}">
              <span>${esc(t.label)}</span><span class="cnt">${cnts[t.id] || 0}</span>
            </button>`).join('')}
        </div>
        <button class="btn pri sm" id="nNew">+ 新建</button>
        <button class="btn gh sm" id="nSave">保存全部</button>
      </div>
      <div class="ngrid-wrap">
        <div class="ngrid">
          ${items.length === 0
            ? '<div class="empty-grid">暂无匹配节点</div>'
            : renderGroups.map(grp => `
              <section class="cgrp">
                <header class="cgrp-hd">
                  <h3>${esc(grp.label)}</h3>
                  <span class="n">${grp.items.length}</span>
                </header>
                <div class="cards">
                  ${grp.items.map(it => renderNodeCard(it)).join('')}
                </div>
              </section>`).join('')}
        </div>
      </div>
    </div>`;

  $('#nsearch').oninput = e => { S.search = e.target.value; renderNode(); };
  $('#ntypes').onclick = e => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    S.filter = b.dataset.t; renderNode();
  };
  document.querySelectorAll('.card[data-k]').forEach(el => {
    el.onclick = () => openNodeDetail({ kind: el.dataset.k, id: el.dataset.i, type: el.dataset.tp });
  });
  $('#nNew').onclick = newNode;
  $('#nSave').onclick = saveAll;
}

function matchesNodeSearch(it, kw) {
  if (!kw) return true;
  const parts = [it.id, it.title, it.sub];
  if (it.kind === 'prompt') {
    const p = promptById(it.id);
    if (p) parts.push(p.template, p.category, p.dartName);
  } else if (it.kind === 'variable') {
    const v = (S.pd?.variables || []).find(x => x.name === it.id);
    if (v) parts.push(v.description, v.label, v.valueSource, shapeText(v.runtimeShape), v.sampleValue, v.runtimeSampleValue);
  } else if (it.kind === 'asset') {
    const a = (S.acDoc?.assets?.[it.type] || []).find(x => x.id === it.id);
    if (a) parts.push(a.name, a.description, a.note);
  }
  return parts.some(x => String(x ?? '').toLowerCase().includes(kw));
}

function renderNodeCard(it) {
  const classes = ['card'];
  if (it.dirty) classes.push('dty');
  const retired = it.kind === 'prompt' && isRetiredPromptId(it.id);
  if (retired) classes.push('retired');
  let descHtml = '';
  let bodyHtml = '';
  if (it.kind === 'prompt') {
    const p = promptById(it.id);
    if (p) {
      if (p.template) bodyHtml = `<div class="card-body">${esc(p.template)}</div>`;
    }
  } else if (it.kind === 'variable') {
    const v = (S.pd?.variables || []).find(x => x.name === it.id);
    if (v) {
      if (v.description) descHtml = `<div class="card-desc">${esc(v.description)}</div>`;
      const sv = previewValueForVariable(v);
      if (sv !== undefined && sv !== null && sv !== '') {
        bodyHtml = `<div class="card-body">${esc(String(sv))}</div>`;
      }
    }
  } else if (it.kind === 'asset') {
    const a = (S.acDoc?.assets?.[it.type] || []).find(x => x.id === it.id);
    if (a) {
      const desc = a.description || a.note || '';
      if (desc) descHtml = `<div class="card-desc">${esc(desc)}</div>`;
      const summarySrc = a.safeSummary !== undefined && a.safeSummary !== null
        ? a.safeSummary
        : assetCardSummary(a);
      if (summarySrc !== null && summarySrc !== undefined && summarySrc !== '') {
        const text = typeof summarySrc === 'string' ? summarySrc : JSON.stringify(summarySrc, null, 2);
        if (text && text !== '{}' && text !== '[]') {
          bodyHtml = `<div class="card-body">${esc(text)}</div>`;
        }
      }
    }
  }
  const tags = [`<span class="tag">${esc(TYPE_LABEL[it.type] || it.type)}</span>`];
  if (retired) tags.push('<span class="tag mut">旧/未用</span>');
  if (it.kind === 'variable' && variableUsage(it.id).orphan) tags.push('<span class="tag am">孤立</span>');
  if (it.dirty) tags.push('<span class="tag am">未保存</span>');
  const hint = retired ? ' title="该提示词元信息标记为旧版、遗留、废弃或未使用；仅弱化展示，不影响编辑或保存。"' : '';
  return `<div class="${classes.join(' ')}" data-k="${esc(it.kind)}" data-i="${esc(it.id)}" data-tp="${esc(it.type)}"${hint}>
    <div class="card-hd">
      <span class="card-t">${esc(it.title)}</span>
      ${tags.join('')}
    </div>
    <div class="card-meta">${esc(it.sub)}</div>
    ${descHtml}
    ${bodyHtml || (descHtml ? '' : '<div class="card-empty">（无简介）</div>')}
  </div>`;
}

function assetCardSummary(a) {
  // 把资产里非元数据的字段拼成简介摘要
  const skip = new Set(['id', 'name', 'enabled', 'safeSummary', 'createdAt', 'updatedAt', 'nodeType', 'assetType']);
  const out = {};
  for (const k of Object.keys(a || {})) {
    if (skip.has(k)) continue;
    const v = a[k];
    if (v === null || v === undefined || v === '') continue;
    out[k] = v;
  }
  return Object.keys(out).length ? out : null;
}

function openNodeDetail(sel) {
  selectNode(sel);
  S.nodeView = 'detail';
  render();
}

function backToNodeCards() {
  S.nodeView = 'cards';
  S.sel = null;
  S.draft = null;
  render();
}

function renderNodeDetailPage() {
  const typeLabel = TYPE_LABEL[S.sel?.type] || S.sel?.type || '';
  $('#body').innerHTML = `
    <div class="dpage">
      <div class="dpage-bar">
        <button class="dpage-back" id="nBack">← 返回节点库</button>
        <div class="dpage-crumbs">
          <span>节点库</span>
          <span class="sep">/</span>
          <span class="cur">${esc(typeLabel)}</span>
        </div>
      </div>
      <div class="dpage-bd">
        ${renderNodeDetail()}
      </div>
    </div>`;

function selectNode(sel) {
  S.sel = sel;
  if (sel.kind === 'asset') {
    const arr = S.acDoc?.assets?.[sel.type] || [];
    const found = arr.find(x => x.id === sel.id);
    S.draft = found ? clone(found) : null;
  } else {
    S.draft = null;
  }
}

function renderNodeDetail() {
  if (!S.sel) {
    return `<div class="ndtl-empty">请选择一个节点查看详情</div>`;
  }
  if (S.sel.kind === 'prompt') return renderPromptDetail();
  if (S.sel.kind === 'variable') return renderVariableDetail();
  if (S.sel.kind === 'asset') return renderAssetDetail();
  return '';
}

function bindDetailHandlers() {
  // 提示词字段
  for (const inp of document.querySelectorAll('[data-fld]')) {
    inp.oninput = e => onPdFieldChange(e.target);
  }
  // 资产字段
  for (const inp of document.querySelectorAll('[data-afld]')) {
    inp.oninput = e => onAssetFieldChange(e.target);
  }
  for (const b of document.querySelectorAll('[data-act]')) {
    b.onclick = () => detailAction(b.dataset.act);
  }
}

function onPdFieldChange(el) {
  const fld = el.dataset.fld;
  if (S.sel?.kind === 'prompt') {
    const p = (S.pd?.prompts || []).find(x => x.id === S.sel.id);
    if (!p) return;
    if (fld === 'variables') {
      p.variables = el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    } else {
      p[fld] = el.value;
    }
    if (fld === 'id') S.sel.id = el.value;
    updateStatus();
  } else if (S.sel?.kind === 'variable') {
    const v = (S.pd?.variables || []).find(x => x.name === S.sel.id);
    if (!v) return;
    if (fld === 'runtimeShape') {
      const raw = el.value.trim();
      if (!raw) {
        v.runtimeShape = '';
        el.style.borderColor = '';
      } else {
        try {
          v.runtimeShape = JSON.parse(raw);
          el.style.borderColor = '';
        } catch {
          v.runtimeShape = raw;
          el.style.borderColor = 'var(--am)';
        }
      }
    } else {
      v[fld] = el.value;
    }
    if (fld === 'name') S.sel.id = el.value;
    updateStatus();
  }
}

function onAssetFieldChange(el) {
  const fld = el.dataset.afld;
  if (!S.draft) return;
  if (fld === '__raw') {
    try {
      const obj = JSON.parse(el.value);
      S.draft = obj;
      el.style.borderColor = '';
    } catch { el.style.borderColor = 'var(--rd)'; }
  } else if (el.type === 'checkbox') {
    S.draft[fld] = el.checked;
  } else {
    S.draft[fld] = el.value;
  }
  updateStatus();
}

async function detailAction(act) {
  if (act === 'del-prompt') {
    if (!await confirm2('删除提示词', `确定删除 ${S.sel.id}？`)) return;
    S.pd.prompts = S.pd.prompts.filter(p => p.id !== S.sel.id);
    S.sel = null;
    S.nodeView = 'cards';
    render();
  } else if (act === 'del-var') {
    if (!await confirm2('删除变量', `确定删除 {${S.sel.id}}？`)) return;
    S.pd.variables = S.pd.variables.filter(v => v.name !== S.sel.id);
    S.sel = null;
    S.nodeView = 'cards';
    render();
  } else if (act === 'save-asset') {
    await saveAsset();
  } else if (act === 'del-asset') {
    if (!await confirm2('删除节点', `确定删除 ${S.draft.id}？`)) return;
    S.saving = true; updateStatus();
    try {
      await api(`${AC}/nodes/${encodeURIComponent(S.draft.id)}`, { method: 'DELETE' });
      await reloadAcDoc();
      S.sel = null; S.draft = null;
      S.nodeView = 'cards';
      toast('已删除', 'ok');
    } catch (e) { toast(e.message, 'err'); }
    S.saving = false; render();
  }
}

async function saveAsset() {
  if (!S.draft) return;
  S.saving = true; updateStatus();
  try {
    await api(`${AC}/nodes/${encodeURIComponent(S.draft.id)}`, {
      method: 'PUT',
      body: JSON.stringify({ node: S.draft }),
    });
    await reloadAcDoc();
    toast('已保存', 'ok');
  } catch (e) { toast(e.message, 'err'); }
  S.saving = false; render();
}

async function newNode() {
  const t = S.filter === 'all' ? 'prompt' : S.filter;
  const typeDef = TYPES.find(x => x.id === t);
  if (typeDef?.src === 'pd') {
    if (t === 'prompt') {
      const id = prompt('提示词 ID(点号分隔，如 chat.foo.bar)');
      if (!id || !id.trim()) return;
      const dartName = id.trim().replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      S.pd.prompts.push({ id: id.trim(), dartName, title: id.trim(), description: '', template: '', variables: [] });
      S.sel = { kind: 'prompt', id: id.trim(), type: 'prompt' };
      S.nodeView = 'detail';
    } else {
      const name = prompt('变量名(英文)');
      if (!name || !name.trim()) return;
      S.pd.variables.push({ name: name.trim(), label: name.trim(), description: '', usage: 'prompt_placeholder', valueSource: '', runtimeShape: { type: 'string' }, sampleValue: '', runtimeSampleValue: '' });
      S.sel = { kind: 'variable', id: name.trim(), type: 'variable' };
      S.nodeView = 'detail';
    }
    render();
  } else {
    const name = prompt(`新建 ${TYPE_LABEL[t]} · 名称`);
    if (!name || !name.trim()) return;
    S.saving = true; updateStatus();
    try {
      const r = await api(`${AC}/nodes`, {
        method: 'POST',
        body: JSON.stringify({ node: { name: name.trim(), nodeType: t, assetType: t } }),
      });
      await reloadAcDoc();
      S.sel = { kind: 'asset', id: r.node.id, type: t };
      S.draft = clone((S.acDoc?.assets?.[t] || []).find(a => a.id === r.node.id));
      S.nodeView = 'detail';
      toast('已创建', 'ok');
    } catch (e) { toast(e.message, 'err'); }
    S.saving = false; render();
  }
}

async function saveAll() {
  if (!S.pd) return;
  if (JSON.stringify(S.pd) === JSON.stringify(S.pdOrig)) {
    toast('没有改动');
    return;
  }
  S.saving = true; updateStatus();
  try {
    const r = await api(`${PD}/document`, {
      method: 'PUT',
      body: JSON.stringify({ document: S.pd }),
    });
    S.pd = r.document;
    S.pdOrig = clone(r.document);
    await api(`${AC}/document/sync-project`, { method: 'POST' }).catch(() => null);
    await reloadAcDoc();
    if (S.agentSel) await loadAgentPromptPreview(S.agentSel, { rerender: false });
    toast(r.message || '已保存', 'ok');
  } catch (e) { toast(`保存失败：${e.message}`, 'err'); }
  S.saving = false; render();
}

function renderAgent() {
  if (S.agentView !== 'detail' || !S.agentSel) {
    renderAgentCards();
    return;
  }
  renderAgentDetail();
}

function renderAgentCards() {
  const kw = S.agentSearch.trim().toLowerCase();
  const list = S.agents.filter(a => {
    if (!kw) return true;
    return [a.id, a.name, a.agentKind].some(x => String(x || '').toLowerCase().includes(kw));
  });
  $('#body').innerHTML = `
    <div class="acards-wrap">
      <div class="acards-bar">
        <span class="ttl">Agent</span>
        <span class="cnt">${list.length}/${S.agents.length}</span>
        <div class="spc"></div>
        <input class="search" id="aSearch" placeholder="搜索 Agent…" value="${esc(S.agentSearch)}">
        <input class="user-id" id="aContactUserId" placeholder="用户 ID" value="${esc(S.agentContactUserId)}" title="可选：填写后同步该用户的真实联系人；留空只同步草稿联系人">
        <button class="btn gh sm" id="aEnsure" title="为草稿联系人或指定用户的真实联系人补齐 chat agent">同步联系人</button>
        <button class="btn pri sm" id="aNewAgent">+ 新 Agent</button>
      </div>
      <div class="acards" id="acards">
        ${S.agents.length === 0
          ? '<div class="acard-empty">暂无 Agent。点 <code>+ 新 Agent</code> 创建，或 <code>同步联系人</code> 为联系人补齐 chat agent。</div>'
          : list.length === 0
            ? '<div class="acard-empty">没有匹配的 Agent</div>'
            : list.map(a => agentCardHtml(a)).join('')}
      </div>
    </div>`;

  $('#aSearch').oninput = e => { S.agentSearch = e.target.value; renderAgentCards(); };
  $('#aContactUserId').oninput = e => { S.agentContactUserId = e.target.value; };
  $('#aEnsure').onclick = ensureAgents;
  $('#aNewAgent').onclick = newAgent;
  $('#acards').onclick = e => {
    const card = e.target.closest('[data-aid]');
    if (!card) return;
    selectAgent(card.dataset.aid);
  };
}

function agentCardHtml(a) {
  const kind = AGENT_KIND_LABEL[a.agentKind] || a.agentKind || 'chat';
  const enabled = a.enabled !== false;
  const tp = a.triggerPolicy || {};
  const triggerKind = TRIGGER_KIND_LABEL[tp.triggerKind] || tp.triggerKind || '—';
  const triggerOn = tp.enabled !== false;
  const summary = a.bindingSummary || { totalBindings: 0, totals: {}, enabled: {} };
  const totalEnabled = Object.values(summary.enabled || {}).reduce((s, n) => s + (n || 0), 0);
  const totalAll = summary.totalBindings || 0;
  const cls = ['acard'];
  if (!enabled) cls.push('disabled');
  return `<div class="${cls.join(' ')}" data-aid="${esc(a.id)}">
    <div class="acard-hd">
      <div class="acard-name">${esc(a.name || a.id)}</div>
      <div class="acard-meta">
        <span class="tag ac">${esc(kind)}</span>
        ${enabled ? '' : '<span class="tag am">已停用</span>'}
      </div>
    </div>
    <div class="acard-id">${esc(a.id)}</div>
    <div class="acard-row">
      <span class="lb">绑定节点</span>
      <span>${totalEnabled}/${totalAll}</span>
      <span class="lb" style="margin-left:10px">触发</span>
      <span>${esc(triggerKind)}${triggerOn ? '' : '（已关）'}</span>
    </div>
  </div>`;
}

function backToCards() {
  S.agentView = 'cards';
  S.agentSel = null;
  S.graph = null;
  S.graphSel = null;
  S.graphDirty = false;
  S.connectingFrom = null;
  render();
}

function libraryItems() {
  const groups = [];
  // 提示词
  const prompts = (S.pd?.prompts || []).map(p => ({ id: p.id, type: 'prompt', title: p.title || p.id, retired: isRetiredPrompt(p) }));
  if (prompts.length) groups.push({ label: '提示词', items: prompts });
  // 资产分组
  const assetGroups = {
    '人设·角色': ['role_card'],
    '预设·世界': ['silly_tavern_preset', 'lorebook', 'extension_prompt'],
    '工具·策略': ['tool', 'tool_policy'],
    '输出·渲染': ['output_contract', 'provider_renderer', 'post_processor'],
    '上下文': ['memory', 'conversation_window', 'runtime_facts'],
    '正则·变换': ['regex_set', 'regex_transform'],
  };
  for (const [label, types] of Object.entries(assetGroups)) {
    const items = [];
    for (const t of types) {
      for (const a of (S.acDoc?.assets?.[t] || [])) {
        items.push({ id: a.id, type: t, title: a.name || a.id });
      }
    }
    if (items.length) groups.push({ label, items });
  }
  return groups;
}

function renderLibraryItem(it) {
  const cls = ['alib-it'];
  if (it.retired) cls.push('retired');
  const hint = it.retired ? ' title="该提示词元信息标记为旧/未用；拖入画布后节点会保持同类弱化状态。"' : '';
  return `<div class="${cls.join(' ')}" draggable="true" data-nid="${esc(it.id)}" data-nt="${esc(it.type)}" data-nl="${esc(it.title)}"${hint}>
    <span class="icn"></span><span>${esc(it.title)}</span>${it.retired ? '<span class="alib-badge">旧/未用</span>' : ''}
  </div>`;
}

function bindLibraryDrag() {
  document.querySelectorAll('.alib-it').forEach(el => {
    el.ondragstart = e => {
      e.dataTransfer.setData('text/plain', JSON.stringify({
        nodeId: el.dataset.nid, nodeType: el.dataset.nt, label: el.dataset.nl,
      }));
      e.dataTransfer.effectAllowed = 'copy';
    };
  });
  const wrap = $('#canvasWrap');
  if (!wrap) return;
  wrap.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; };
  wrap.ondrop = e => {
    e.preventDefault();
    if (!S.agentSel) return;
    let payload;
    try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
    if (!payload?.nodeId) return;
    const rect = wrap.getBoundingClientRect();
    const x = e.clientX - rect.left - 70;
    const y = e.clientY - rect.top - 22;
    addCanvasNode(payload, { x, y });
  };
}

async function selectAgent(id) {
  S.agentSel = id;
  S.agentView = 'detail';
  S.graphSel = { kind: 'agent', id };
  S.graphDirty = false;
  invalidateAgentPromptPreview();
  await loadGraph(id);
  await loadAgentPromptPreview(id, { rerender: false });
  render();
}

async function loadGraph(id) {
  try {
    const r = await api(`${AC}/agents/${encodeURIComponent(id)}/graph`);
    S.graph = r.graph || { nodes: [], edges: [] };
  } catch (e) {
    S.graph = { nodes: [], edges: [] };
    toast(`流程图载入失败：${e.message}`, 'err');
  }
}

function invalidateAgentPromptPreview() {
  S.agentPromptPreview = null;
  S.agentPromptPreviewFor = null;
}

async function loadAgentPromptPreview(id, opts = {}) {
  if (!id) return;
  const rerender = opts.rerender !== false;
  S.agentPromptPreviewLoading = true;
  if (rerender) render();
  try {
    const r = await api(`${AC}/agents/${encodeURIComponent(id)}/prompt-preview`, {
      method: 'POST',
      body: JSON.stringify({ graph: S.graph || undefined }),
    });
    S.agentPromptPreview = r;
    S.agentPromptPreviewFor = id;
  } catch (e) {
    S.agentPromptPreview = { error: e.message };
    S.agentPromptPreviewFor = id;
    toast(`提示词预览失败：${e.message}`, 'err');
  }
  S.agentPromptPreviewLoading = false;
  if (rerender) render();
}

function addCanvasNode(payload, pos) {
  if (!S.graph) S.graph = { nodes: [], edges: [] };
  const id = 'g_' + Math.random().toString(36).slice(2, 10);
  S.graph.nodes.push({
    id, nodeId: payload.nodeId, nodeType: payload.nodeType,
    label: payload.label, enabled: true,
    position: { x: Math.max(0, pos.x), y: Math.max(0, pos.y) },
  });
  S.graphSel = { kind: 'node', id };
  S.graphDirty = true;
  invalidateAgentPromptPreview();
  render();
}

function renderCanvas() {
  const canvas = $('#canvas');
  if (!canvas) return;
  const g = S.graph || { nodes: [], edges: [] };
  // 节点 DOM
  canvas.innerHTML = `<svg id="edges"></svg>` +
    g.nodes.map(n => {
      const cls = ['gnode'];
      if (S.graphSel?.kind === 'node' && S.graphSel.id === n.id) cls.push('sel');
      if (S.connectingFrom === n.id) cls.push('connecting');
      if (n.enabled === false) cls.push('disabled');
      const retired = isRetiredPromptGraphNode(n);
      if (retired) cls.push('retired');
      const hint = retired ? ' title="该画布节点引用了旧/未使用提示词；状态仅用于展示，不改变图保存或运行时装配。"' : '';
      const stage = graphNodeStage(n);
      return `<div class="${cls.join(' ')}" data-gid="${n.id}" style="left:${n.position.x}px;top:${n.position.y}px"${hint}>
        <div class="gnode-t">${esc(n.label)}</div>
        ${stage ? `<div class="gnode-stage">${esc(stage.label)}</div>` : ''}
        <div class="gnode-k">${esc(TYPE_LABEL[n.nodeType] || n.nodeType)}</div>
        <div class="gport l" data-port="in" data-gid="${n.id}"></div>
        <div class="gport" data-port="out" data-gid="${n.id}"></div>
      </div>`;
    }).join('');
  drawEdges();
  bindCanvasInteractions();
}

function drawEdges() {
  const svg = $('#edges');
  if (!svg) return;
  const g = S.graph || { nodes: [], edges: [] };
  const paths = [];
  for (const e of g.edges) {
    const srcEl = document.querySelector(`.gnode[data-gid="${e.source}"]`);
    const tgtEl = document.querySelector(`.gnode[data-gid="${e.target}"]`);
    if (!srcEl || !tgtEl) continue;

    const a = g.nodes.find(n => n.id === e.source);
    const b = g.nodes.find(n => n.id === e.target);
    if (!a || !b) continue;

    const x1 = a.position.x + (srcEl.offsetWidth || 180);
    const y1 = a.position.y + (srcEl.offsetHeight ? srcEl.offsetHeight / 2 : 36);
    const x2 = b.position.x;
    const y2 = b.position.y + (tgtEl.offsetHeight ? tgtEl.offsetHeight / 2 : 36);

    const dx = Math.max(50, Math.abs(x2 - x1) / 2);
    const cls = ['edge'];
    if (S.graphSel?.kind === 'edge' && S.graphSel.id === e.id) cls.push('sel');
    if (e.enabled === false) cls.push('disabled');
    paths.push(`<path d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}" class="${cls.join(' ')}" data-eid="${e.id}"></path>`);
  }
  svg.innerHTML = `<defs></defs>${paths.join('')}`;
  svg.querySelectorAll('path').forEach(p => {
    p.onclick = ev => { ev.stopPropagation(); S.graphSel = { kind: 'edge', id: p.dataset.eid }; render(); };
  });
}

function bindCanvasInteractions() {
  const canvas = $('#canvas');
  if (!canvas) return;
  canvas.onclick = e => {
    if (e.target === canvas || e.target.tagName === 'svg') {
      S.graphSel = { kind: 'agent', id: S.agentSel };
      S.connectingFrom = null;
      render();
    }
  };
  canvas.querySelectorAll('.gnode').forEach(el => {
    el.onmousedown = e => onNodeMouseDown(e, el);
  });
  canvas.querySelectorAll('.gport').forEach(el => {
    el.onclick = e => { e.stopPropagation(); handlePortClick(el); };
    el.onmousedown = e => e.stopPropagation();
  });
}

function onNodeMouseDown(e, el) {
  if (e.button !== 0) return;
  if (e.target.classList.contains('gport')) return;
  e.preventDefault();
  const gid = el.dataset.gid;
  S.graphSel = { kind: 'node', id: gid };
  const n = S.graph.nodes.find(x => x.id === gid);
  const startX = e.clientX, startY = e.clientY;
  const origX = n.position.x, origY = n.position.y;
  let moved = false;
  el.classList.add('dragging');
  const move = ev => {
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    n.position = { x: Math.max(0, origX + dx), y: Math.max(0, origY + dy) };
    el.style.left = n.position.x + 'px';
    el.style.top = n.position.y + 'px';
    drawEdges();
  };
  const up = () => {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    el.classList.remove('dragging');
    if (moved) S.graphDirty = true;
    render();
  };
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
}

function handlePortClick(el) {
  const gid = el.dataset.gid;
  const port = el.dataset.port;
  if (port === 'out') {
    S.connectingFrom = gid;
    render();
  } else if (port === 'in' && S.connectingFrom && S.connectingFrom !== gid) {
    const eid = `e_${S.connectingFrom}_${gid}_${Math.random().toString(36).slice(2, 6)}`;
    if (!S.graph.edges.some(e => e.source === S.connectingFrom && e.target === gid)) {
      S.graph.edges.push({
        id: eid, source: S.connectingFrom, target: gid,
        sourcePort: 'out', targetPort: 'in', enabled: true,
      });
      S.graphDirty = true;
      invalidateAgentPromptPreview();
    }
    S.connectingFrom = null;
    render();
  }
}

function renderAgentPromptPreview() {
  const p = S.agentPromptPreviewFor === S.agentSel ? S.agentPromptPreview : null;
  if (S.agentPromptPreviewLoading) {
    return `<div class="preview-panel">
      <div class="preview-panel-hd"><strong>示例渲染提示词预览</strong><button class="btn gh sm" data-pact="refresh-agent-prompt-preview">刷新</button></div>
      <div class="preview-meta">载入中…</div>
    </div>`;
  }
  if (p?.error) {
    return `<div class="preview-panel">
      <div class="preview-panel-hd"><strong>示例渲染提示词预览</strong><button class="btn gh sm" data-pact="refresh-agent-prompt-preview">刷新</button></div>
      <div class="preview-meta">${esc(p.error)}</div>
    </div>`;
  }
  const text = p?.actualPromptPreview?.combinedText || '';
  const count = p?.actualPromptPreview?.messageCount ?? 0;
  const groups = p?.actualPromptPreview?.stageGroups || p?.stageGroups || [];
  const warnings = p?.warnings || [];
  const stale = !p ? ' · 需要刷新' : '';
  const groupHtml = groups.length ? groups.map(g => `<div class="preview-stage">
    <div class="preview-stage-title">
      <strong>${esc(g.label || g.stage || '默认请求')}</strong>
      <code>${esc(g.stage || '')}</code>
    </div>
    <div class="preview-meta">${g.messageCount ?? (g.renderedMessages || []).length} 条 prompt message</div>
    <textarea class="preview-text" readonly>${esc(g.combinedText || '')}</textarea>
  </div>`).join('') : '';
  return `<div class="preview-panel">
    <div class="preview-panel-hd"><strong>示例渲染提示词预览</strong><button class="btn gh sm" data-pact="refresh-agent-prompt-preview">刷新</button></div>
    <div class="preview-meta">${count} 条 prompt message · ${groups.length || 0} 个阶段 · 已按变量样例替换${stale}</div>
    ${warningHtml(warnings)}
    ${groupHtml || `<textarea class="preview-text" readonly>${esc(text || '当前图没有启用的 prompt 节点。')}</textarea>`}
  </div>`;
}

  if (!p) {

      <div class="preview-meta">未找到提示词：${esc(n.nodeId || '')}</div>
    </div>`;
  }
  const vars = (p.variables || []).join(', ');
  const validation = promptValidation(p);
  const renderedPreview = renderTemplateWithSamples(p.template || '');
  return `<div class="prompt-node-editor">
    <div class="preview-panel-hd">
      <strong>节点提示词</strong>
      ${promptDirty(p.id) ? '<span class="tag am">未保存</span>' : ''}

function bindPropsHandlers() {
  document.querySelectorAll('[data-pfld]').forEach(el => {
    el.oninput = el.onchange = () => onAgentPropChange(el);
  });
  document.querySelectorAll('[data-gfld]').forEach(el => {
    el.oninput = el.onchange = () => onGraphNodeChange(el);
  });
  document.querySelectorAll('[data-gprompt-fld]').forEach(el => {
    el.oninput = el.onchange = () => onGraphPromptFieldChange(el);
  });
  document.querySelectorAll('[data-efld]').forEach(el => {
    el.onchange = () => onEdgeChange(el);
  });
  document.querySelectorAll('[data-pact]').forEach(el => {
    el.onclick = () => propAction(el.dataset.pact);
  });
}

function onAgentPropChange(el) {
  const fld = el.dataset.pfld;
  const a = S.agents.find(x => x.id === S.agentSel);
  if (!a) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  if (!a.triggerPolicy) a.triggerPolicy = {};
  if (fld === 'name') a.name = v;
  else if (fld === 'agentKind') a.agentKind = v;
  else if (fld === 'enabled') a.enabled = v;
  else if (fld === 'triggerKind') a.triggerPolicy.triggerKind = v;
  else if (fld === 'triggerSource') a.triggerPolicy.source = v;
  else if (fld === 'triggerEnabled') a.triggerPolicy.enabled = v;
  S.graphDirty = true;
  updateStatus();
}

function onGraphNodeChange(el) {
  const fld = el.dataset.gfld;
  const n = S.graph?.nodes.find(x => x.id === S.graphSel.id);
  if (!n) return;
  if (fld === 'enabled') n.enabled = el.checked;
  else n[fld] = el.value;
  S.graphDirty = true;
  invalidateAgentPromptPreview();
  if (fld === 'label' || fld === 'enabled') render();
  else updateStatus();
}

function onGraphPromptFieldChange(el) {
  const fld = el.dataset.gpromptFld;
  const n = S.graph?.nodes.find(x => x.id === S.graphSel.id);
  const p = n ? promptById(n.nodeId) : null;
  if (!p) return;
  if (fld === 'variables') {
    p.variables = el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  } else {
    p[fld] = el.value;
  }
  invalidateAgentPromptPreview();
  updateStatus();
}

function onEdgeChange(el) {
  const fld = el.dataset.efld;
  const e = S.graph?.edges.find(x => x.id === S.graphSel.id);
  if (!e) return;
  if (fld === 'enabled') e.enabled = el.checked;
  S.graphDirty = true;
  invalidateAgentPromptPreview();
  render();
}

async function propAction(act) {
  if (act === 'save-agent') {
    await saveAgentProps();
  } else if (act === 'refresh-agent-prompt-preview') {
    await loadAgentPromptPreview(S.agentSel);
  } else if (act === 'save-graph-prompt') {
    await saveGraphPrompt();
  } else if (act === 'del-agent') {
    if (!await confirm2('删除 Agent', `确定删除 ${S.agentSel}？`)) return;
    S.saving = true; updateStatus();
    try {
      await api(`${AC}/agents/${encodeURIComponent(S.agentSel)}`, { method: 'DELETE' });
      await reloadAgents();
      S.agentSel = null; S.graph = null; S.graphSel = null;
      S.agentView = 'cards';
      toast('已删除', 'ok');
    } catch (e) { toast(e.message, 'err'); }
    S.saving = false; render();
  } else if (act === 'del-graph-node') {
    const id = S.graphSel.id;
    S.graph.nodes = S.graph.nodes.filter(n => n.id !== id);
    S.graph.edges = S.graph.edges.filter(e => e.source !== id && e.target !== id);
    S.graphSel = { kind: 'agent', id: S.agentSel };
    S.graphDirty = true;
    invalidateAgentPromptPreview();
    render();
  } else if (act === 'del-edge') {
    const id = S.graphSel.id;
    S.graph.edges = S.graph.edges.filter(e => e.id !== id);
    S.graphSel = { kind: 'agent', id: S.agentSel };
    S.graphDirty = true;
    invalidateAgentPromptPreview();
    render();
  }
}

async function saveAgentProps() {
  const a = S.agents.find(x => x.id === S.agentSel);
  if (!a) return;
  S.saving = true; updateStatus();
  try {
    await api(`${AC}/agents/${encodeURIComponent(a.id)}`, {
      method: 'PUT',
      body: JSON.stringify({ agent: a }),
    });
    await reloadAgents();
    toast('属性已保存', 'ok');
  } catch (e) { toast(e.message, 'err'); }
  S.saving = false; render();
}

async function saveGraphPrompt() {
  const n = S.graph?.nodes.find(x => x.id === S.graphSel?.id);
  const p = n ? promptById(n.nodeId) : null;
  if (!n || !p) return;
  S.saving = true; updateStatus();
  try {
    const r = await api(`${AC}/prompt-default-nodes/${encodeURIComponent(p.id)}`, {
      method: 'PUT',
      body: JSON.stringify({
        prompt: {
          title: p.title || '',
          category: p.category || '',
          description: p.description || '',
          variables: p.variables || [],
          template: p.template || '',
        },
      }),
    });
    S.pd = r.document;
    S.pdOrig = clone(r.document);
    await reloadAcDoc();
    await loadAgentPromptPreview(S.agentSel, { rerender: false });
    toast(r.message || '提示词已保存', 'ok');
  } catch (e) {
    toast(`保存提示词失败：${e.message}`, 'err');
  }
  S.saving = false; render();
}

async function saveGraph() {
  if (!S.agentSel || !S.graph) return;
  S.saving = true; updateStatus();
  try {
    await api(`${AC}/agents/${encodeURIComponent(S.agentSel)}/graph`, {
      method: 'PUT',
      body: JSON.stringify({ graph: S.graph }),
    });
    S.graphDirty = false;
    await loadAgentPromptPreview(S.agentSel, { rerender: false });
    toast('流程图已保存', 'ok');
  } catch (e) { toast(e.message, 'err'); }
  S.saving = false; render();
}

async function newAgent() {
  const name = prompt('Agent 名称');
  if (!name?.trim()) return;
  S.saving = true; updateStatus();
  try {
    const r = await api(`${AC}/agents`, {
      method: 'POST',
      body: JSON.stringify({ agent: { name: name.trim(), agentKind: 'chat' } }),
    });
    await reloadAgents();
    S.agentSel = r.agent.id;
    S.agentView = 'detail';
    await loadGraph(r.agent.id);
    await loadAgentPromptPreview(r.agent.id, { rerender: false });
    S.graphSel = { kind: 'agent', id: r.agent.id };
    toast('已创建', 'ok');
  } catch (e) { toast(e.message, 'err'); }
  S.saving = false; render();
}

async function ensureAgents() {
  const rawUserId = S.agentContactUserId.trim();
  if (rawUserId && !/^[1-9]\d*$/.test(rawUserId)) {
    toast('用户 ID 必须是正整数', 'err');
    return;
  }
  const userId = rawUserId ? Number.parseInt(rawUserId, 10) : null;
  S.saving = true; updateStatus();
  try {
    const body = { includeDrafts: true };
    if (userId !== null) body.userId = userId;
    const r = await api(`${AC}/contacts/chat-agents/ensure-all`, {
      method: 'POST',
      body: JSON.stringify(body),
    });
    await reloadAgents();
    toast(`同步完成：新建 ${r.createdCount} / 共 ${r.total}`, 'ok');
  } catch (e) { toast(e.message, 'err'); }
  S.saving = false; render();
}

// ── 全局键盘 ──
document.addEventListener('keydown', e => {
  // 输入框中跳过
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
  if (e.key === 'Delete' && S.mode === 'agent' && S.graphSel) {
    if (S.graphSel.kind === 'node') propAction('del-graph-node');
    else if (S.graphSel.kind === 'edge') propAction('del-edge');
  } else if (e.key === 'Escape') {
    S.connectingFrom = null;
    if (S.mode === 'node' && S.nodeView === 'detail') {
      backToNodeCards();
    } else if (S.mode === 'agent') {
      render();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (S.mode === 'node') saveAll();
    else if (S.mode === 'agent' && S.graphDirty) saveGraph();
  }
});

// ── 初始化 ──
document.querySelectorAll('#tabs button').forEach(b => {
  b.onclick = () => {
    S.mode = b.dataset.m;
    if (S.mode === 'node') S.nodeView = 'cards';
    if (S.mode === 'agent') S.agentView = 'cards';
    render();
  };
});

loadAll();
</script>
</body>
</html>

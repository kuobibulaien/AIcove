name: aicove_flutter
description: Flutter frontend for AIcove AI companion
publish_to: 'none'
version: 0.1.0+2026100201

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.6'

dependencies:
  aicove_agent_kernel:
    path: packages/aicove_agent_kernel
  aicove_quickjs:
    path: packages/aicove_quickjs
  mime: ^1.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Component gallery spring comparison; not used by application navigation.
  motor: 1.1.0
  flutter_physics: 0.2.3
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  file_picker: ^8.0.3
  image_picker: ^1.0.7
  image_gallery_saver_plus: ^4.0.1
  permission_handler: ^11.3.1
  crop_your_image: ^2.0.0
  uuid: ^4.2.1  # 用于生成Block和Message的唯一ID
  flutter_slidable: ^3.1.0  # 用于联系人卡片的左滑操作
  figma_squircle: ^0.6.3    # (注释已丢失)
  flutter_local_notifications: ^17.0.0 # 本地通知
  timezone: ^0.9.2 # 时区支持
  # (注释已丢失)
  dio: ^5.4.0  # (注释已丢失)
  path_provider: ^2.1.2  # 文件路径
  crypto: ^3.0.3
  cryptography: 2.9.0
  bonsoir: 7.1.5
  zxing2: 0.2.4
  image: ^4.3.0
  flutter_secure_storage: ^9.0.0  # 安全存储Token
  workmanager: ^0.6.0-rc.1 # (注释已丢失)
  # (注释已丢失)
  chat_bottom_container: ^0.4.0
  # (注释已丢失)
  photo_view: ^0.15.0
  # (注释已丢失)
  cached_network_image: ^3.3.1
  # (注释已丢失)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0  # Android/iOS/macOS/Windows SQLite
  path: ^1.9.0
  # 数据备份导入导出
  archive: ^3.6.0  # ZIP 压缩解压
  share_plus: ^9.0.0  # 分享文件
  package_info_plus: ^8.0.0  # 获取应用版本
  # 保留现有图标与字体，仅适配 Flutter 3.44 的 final IconData。
  lucide_icons:
    path: third_party/lucide_icons
  pretty_qr_code: ^3.3.0  # (注释已丢失)
  flutter_colorpicker: ^1.1.0  # (注释已丢失)
  flutter_svg: ^2.0.10  # SVG 图标支持
  window_manager: ^0.4.3  # (注释已丢失)

  just_audio_windows: ^0.2.2
  liquid_glass_widgets: ^1.4.4
  re_highlight: ^0.0.3
  gpt_markdown: ^1.3.0
  url_launcher: ^6.3.3
  mobile_scanner: 7.3.0  # 局域网配对实时扫一扫

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Drift 代码生成
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter:
  # SDK 升级不同时迁移原生依赖管理，继续使用现有 CocoaPods。
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/preset_runtime/
    - assets/agent_context_defaults.json
    - assets/prompt_defaults.json
    - assets/characters/
    - assets/characters/images/
    - assets/characters/prompts/
    - assets/ui/
    - assets/emoji/
    - assets/stickers/nahida/
    - assets/icons/providers/

# Builds the Windows package for a published GitHub release and attaches it
# to that release. The Android/macOS/iOS packages are built locally by
# apps/aicove_flutter/tool/publish_release.py; Flutter cannot cross-compile
# Windows apps, so this one runs on a GitHub-hosted Windows runner.
name: Windows release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach, e.g. v0.2.0-test.1
        required: true
      ref:
        description: Source to build (default the tag itself)
        required: false

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}

      - name: Resolve version
        run: |
          version="${TAG#v}"
          created=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json createdAt -q .createdAt)
          {
            echo "VERSION=$version"
            echo "BUILD_NAME=${version%%-*}"
            echo "BUILD_NUMBER=$(echo "$created" | cut -c1-10 | tr -d -)01"
            echo "ZIP_NAME=AIcove-$version-windows-x64.zip"
          } >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Build
        working-directory: apps/aicove_flutter
        run: |
          flutter pub get
          flutter build windows --release -v \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" \
            --dart-define=AICOVE_RELEASE_TAG="$VERSION" > build.log 2>&1 || {
            grep -n -i -E "error|fatal|failed" build.log | head -200
            tail -80 build.log
            find .dart_tool/hooks_runner -type f \( -name "*.txt" -o -name "*.log" -o -name "*.json" \) -path "*quickjs*" \
              -exec sh -c 'echo "== $1"; grep -v "^\s*$" "$1" | grep -i -E "error|warning|fatal" | head -60' _ {} \;
            exit 1
          }

      - name: Probe script engine DLL
        if: always()
        working-directory: apps/aicove_flutter
        run: |
          dll="$(pwd)/build/windows/x64/runner/Release/aicove_quickjs.dll"
          ls -la "$(dirname "$dll")"
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          cat > probe.dart <<'DART'
          import 'dart:ffi';
          import 'dart:io';

          typedef _Malloc = Pointer<Uint8> Function(int);
          void main(List<String> args) {
            final crt = DynamicLibrary.open('ucrtbase.dll');
            final malloc = crt.lookupFunction<Pointer<Uint8> Function(IntPtr), _Malloc>('malloc');
            final lib = DynamicLibrary.open(args.first);
            stdout.writeln('loaded');
            final create = lib.lookupFunction<Pointer<Void> Function(), Pointer<Void> Function()>('aqjs_create');
            final eval = lib.lookupFunction<Pointer<Uint8> Function(Pointer<Void>, Pointer<Uint8>, IntPtr),
                Pointer<Uint8> Function(Pointer<Void>, Pointer<Uint8>, int)>('aqjs_eval');
            final destroy = lib.lookupFunction<Void Function(Pointer<Void>), void Function(Pointer<Void>)>('aqjs_destroy');
            final s = create();
            stdout.writeln('created ${s.address}');
            final src = args[1];
            final units = src.codeUnits;
            final buf = malloc(units.length + 1);
            for (var i = 0; i < units.length; i++) buf[i] = units[i];
            buf[units.length] = 0;
            final out = eval(s, buf, units.length);
            var n = 0; final codes = <int>[];
            while (out != nullptr && out[n] != 0) { codes.add(out[n]); n++; }
            stdout.writeln(' -> ${String.fromCharCodes(codes)}');
            destroy(s);
            stdout.writeln('done');
          }
          DART
          sed -i 's/^          //' probe.dart
          set +e
          dart compile exe probe.dart -o probe.exe > /dev/null
          while IFS= read -r src; do
            ./probe.exe "$dll" "$src" > o.txt 2>&1; code=$?
            echo "PROBE [$src] exit=$code $(tr '\n' ' ' < o.txt)"
          done <<'SNIPPETS'
          1+2
          "a"+"b"
          [1,2].length
          ({a:1}).a
          Object.keys({a:1}).length
          JSON.stringify(1)
          JSON.stringify("x")
          JSON.stringify([])
          JSON.stringify([1])
          JSON.stringify({})
          JSON.stringify({a:1})
          [1,2].join()
          String(1.5)
          (0.1+0.2).toString()
          String(123456789012345)
          (12345678901234567890n).toString()
          new Date(0).toISOString()
          /a(b)c/.exec("zabc")[1]
          "abc".replace(/b/g,"x")
          [3,1,2].sort().join()
          (function f(n){return n?f(n-1):0})(100)
          (async()=>40+2)()
          SNIPPETS
          q="$GITHUB_WORKSPACE/apps/aicove_flutter/packages/aicove_quickjs"
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
          cat > variants.bat <<BAT
          @echo off
          call "$vs\VC\Auxiliary\Build\vcvars64.bat" > nul
          set CL_EXE=%VCINSTALLDIR%Tools\Llvm\x64\bin\clang-cl.exe
          for /f "delims=" %%r in ('"%CL_EXE%" /clang:-print-resource-dir') do set RES=%%r
          for /f "delims=" %%b in ('dir /s /b "%RES%\lib\clang_rt.builtins*x86_64*.lib" "%RES%\lib\x86_64-pc-windows-msvc\clang_rt.builtins.lib" 2^>nul') do set BUILTINS=%%b
          echo builtins=%BUILTINS%
          set SRC=$q\src\bridge.c $q\src\quickjs\quickjs.c $q\src\quickjs\dtoa.c $q\src\quickjs\libregexp.c $q\src\quickjs\libunicode.c $q\src\quickjs\cutils.c $q\src\win_compat\win_compat.c
          echo #define CONFIG_VERSION "x" > cfg.h
          mkdir o1 o2
          "%CL_EXE%" /nologo /O2 /Z7 /MD /LD /w /clang:-fwrapv /DNDEBUG /D_GNU_SOURCE /FI$q\src\win_compat\prelude.h /FIcfg.h /I$q\src\win_compat /I$q\src\quickjs %SRC% /Foo1\ /Feqjs_o2.dll /link /DEBUG /NOIMPLIB /NOEXP "%BUILTINS%"
          "%CL_EXE%" /nologo /Od /Z7 /MD /LD /w /clang:-fwrapv /DNDEBUG /D_GNU_SOURCE /FI$q\src\win_compat\prelude.h /FIcfg.h /I$q\src\win_compat /I$q\src\quickjs %SRC% /Foo2\ /Feqjs_od.dll /link /DEBUG /NOIMPLIB /NOEXP "%BUILTINS%"
          BAT
          sed -i 's/^          //' variants.bat
          cmd //c variants.bat
          for v in qjs_o2 qjs_od; do
            ./probe.exe "$(pwd -W)/$v.dll" 'Object.keys({a:1}).length' > o.txt 2>&1; code=$?
            echo "VARIANT $v exit=$code $(tr '\n' ' ' < o.txt)"
          done
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          ls "$cdb" && "$cdb" -g -G -lines -y "$(pwd -W)" -c ".lines;kn 30;q" ./probe.exe "$(pwd -W)/qjs_o2.dll" 'Object.keys({a:1}).length' 2>&1 | grep -v "^ModLoad\|^Symbol search\|^Executable search" | tail -60

      - name: Check script engine on Windows
        working-directory: apps/aicove_flutter
        run: flutter test --reporter expanded test/core/runtime/quickjs_test.dart

      - name: Package
        shell: pwsh
        working-directory: apps/aicove_flutter
        run: |
          $out = "build/package/AIcove"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Path "build/windows/x64/runner/Release/*" -Destination $out
          Compress-Archive -Path $out -DestinationPath "build/package/$env:ZIP_NAME" -Force

      - name: Attach to release
        working-directory: apps/aicove_flutter/build/package
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS
          grep -v " $ZIP_NAME\$" SHA256SUMS > SHA256SUMS.new || true
          sha256sum "$ZIP_NAME" | sed 's/ \*/  /' >> SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$ZIP_NAME" SHA256SUMS --clobber

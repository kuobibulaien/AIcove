# Project-scoped Codex defaults. Codex merges this after the user-level config
# when the project is trusted (`[projects."<abs path>"] trust_level = "trusted"`).

project_doc_fallback_filenames = ["AGENTS.md"]

# hooks.json in this directory needs `[features].hooks = true` in ~/.codex/config.toml
# and a one-time approval in the `/hooks` TUI before it fires.

[mcp_servers.dart]
command = "bash"
args = ["-c", 'exec "$(git rev-parse --show-toplevel)/apps/aicove_flutter/tool/dart_mcp_server"']
startup_timeout_sec = 60
tool_timeout_sec = 120
